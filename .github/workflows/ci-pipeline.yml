name: CI Pipeline Partie A

on:
  push:
    branches: [ "main" ]

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Buildah
        run: sudo apt-get update && sudo apt-get install -y buildah

      - name: Run Build Script
        run: |
          chmod +x ci-scripts/build.sh
          # On ajoute "|| true" pour dire : "Même si Trivy fontione pas continue le job"
          ./ci-scripts/build.sh || true