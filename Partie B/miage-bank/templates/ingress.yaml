{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "miage-bank.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # On indique à Kubernetes que c'est Traefik qui gère cet Ingress
    kubernetes.io/ingress.class: traefik
spec:
  # On définit la classe demandée (Exigence Projet)
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host | quote }} # Le host est pris dans ton values.yaml
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # On pointe vers le service miage-bank
                name: {{ include "miage-bank.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}