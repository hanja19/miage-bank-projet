apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  # Récupéré depuis values.yaml (ou values-prod.yaml)
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      # --- EXIGENCE : ServiceAccount dédié ---
      serviceAccountName: miage-bank-sa
      
      containers:
        - name: miage-bank
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          
          # --- MODIFICATION VAULT (TP 13) ---
          # On combine le ConfigMap (non-sensible) et le Secret (Vault via ESO)
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "miage-bank.fullname" . }}-config
                  key: DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: miage-bank-db-secret # Nom défini dans target.name de l'ExternalSecret
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miage-bank-db-secret
                  key: DB_PASSWORD
          # ----------------------------------

          # --- EXIGENCE : Les Sondes (Probes) ---
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5

          resources:
            {{- toYaml .Values.resources | nindent 12 }}